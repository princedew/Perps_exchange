services:
  postgres:
    image: postgres:17
    container_name: perps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: holy_duck
      POSTGRES_PASSWORD: holy_duck
      POSTGRES_DB: perps_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holy_duck -d perps_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: perps-redis
    restart: unless-stopped
    # command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    # volumes:
    #   - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: